model_parameters:
  onnx_model: /workspace/work/export/model.onnx
  march: bayes-e
  layer_out_dump: false
  working_dir: /workspace/work/ptq-manual
  output_model_file_prefix: yolo11n_640x352_int8_nv12

input_parameters:
  input_name: images
  input_type_rt: nv12
  input_space_and_range: bt601_video
  input_type_train: rgb
  input_layout_train: NCHW
  norm_type: data_scale
  scale_value: 0.00392156862745098

calibration_parameters:
  cal_data_dir: /workspace/work/calibration/rgb
  cal_data_type: float32
  calibration_type: default
  optimization: set_all_nodes_int8

compiler_parameters:
  jobs: 4
  compile_mode: latency
  debug: true
  optimize_level: O3
