# TinySeg binary semantic masks, prepared by ultralytics.data.converter.convert_tinyseg.
# Images: full-frame 640x352; original images may be 640x352 or 640x512.
# PNG IDs are not the legacy polygon IDs (0=drivable, 1=exclusion).
path: tinyseg
train: images/train
val: images/val
masks_dir: masks

names:
  0: non_drivable
  1: drivable

# 255 is unsupervised, not a third class or a non-drivable label.
label_mapping:
  0: 0
  1: 1
  255: ignore_label
